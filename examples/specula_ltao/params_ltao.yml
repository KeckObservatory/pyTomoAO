---
# SPECULA LTAO closed loop driven by a pyTomoAO MMSE tomographic reconstructor.
# Used by specula_ltao.py; see the "pyTomoAO in a SPECULA closed loop" tutorial.
#
# - 10 m circular pupil, 160 px (0.0625 m/px).
# - 6 sodium LGS at 90 km on a 60" radius ring, azimuths 0, 60, ..., 300 deg: the same order
#   and orientation as pyTomoAO's asterism for nLGS = 6.
# - 20x20 Shack-Hartmann per LGS on the KAPA valid-subaperture map (304 valid, d = 0.5 m),
#   SPECULA's IdealDerivativeSensor (noiseless geometric slopes).
# - Ground DM: 349 Gaussian actuators on the KAPA 21x21 map (written by specula_ltao.py).
# - 7-layer Maunakea Ridge median profile (Keck Adaptive Optics Note 503, Dekany 2007),
#   r0 = 0.16 m at 500 nm, L0 = 25 m, frozen flow, zenith.
# - Pseudo-open-loop control (ModalrecExplicitPolc) + integrator at 500 Hz, 1-frame lag.

main:
  class:             'SimulParams'
  root_dir:          './calib'
  pixel_pupil:       160
  pixel_pitch:       0.0625
  total_time:        2.0            # overridden by specula_ltao.py run
  time_step:         0.002          # 500 Hz loop
  zenithAngleInDeg:  0.0

seeing:
  class:             'WaveGenerator'
  constant:          0.6288         # ["] -> r0 = 0.16 m at 500 nm
  outputs: ['output']

wind_speed:
  class:             'WaveGenerator'
  constant:          [6.8, 6.9, 7.1, 7.5, 10.0, 26.9, 18.5]
  outputs: ['output']

wind_direction:
  class:             'WaveGenerator'
  constant:          [0., 60., 135., 200., 260., 320., 30.]
  outputs: ['output']

sci:
  class:             'Source'
  polar_coordinates: [0.0, 0.0]
  magnitude:         10.0
  wavelengthInNm:    1650

lgs1: &LGS
  class:             'Source'
  polar_coordinates: [60.0, 0.0]
  height:            90000
  magnitude:         5.0
  wavelengthInNm:    589
lgs2: { <<: *LGS, polar_coordinates: [60.0, 60.0] }
lgs3: { <<: *LGS, polar_coordinates: [60.0, 120.0] }
lgs4: { <<: *LGS, polar_coordinates: [60.0, 180.0] }
lgs5: { <<: *LGS, polar_coordinates: [60.0, 240.0] }
lgs6: { <<: *LGS, polar_coordinates: [60.0, 300.0] }

pupilstop:
  class:             'Pupilstop'
  simul_params_ref:  'main'

atmo:
  class:             'AtmoInfiniteEvolution'
  simul_params_ref:  'main'
  L0:                [25., 25., 25., 25., 25., 25., 25.]
  heights:           [0., 500., 1000., 2000., 4000., 8000., 16000.]
  Cn2:               [0.517, 0.119, 0.063, 0.061, 0.105, 0.081, 0.054]
  fov:               121.0
  seed:              11
  inputs:
    seeing:          'seeing.output'
    wind_speed:      'wind_speed.output'
    wind_direction:  'wind_direction.output'
  outputs: ['layer_list']

prop:
  class:             'AtmoPropagation'
  simul_params_ref:  'main'
  source_dict_ref:   ['sci', 'lgs1', 'lgs2', 'lgs3', 'lgs4', 'lgs5', 'lgs6']
  inputs:
    atmo_layer_list:   ['atmo.layer_list']
    common_layer_list: ['pupilstop', 'dm.out_layer:-1']
  outputs: ['out_sci_ef', 'out_lgs1_ef', 'out_lgs2_ef', 'out_lgs3_ef', 'out_lgs4_ef', 'out_lgs5_ef', 'out_lgs6_ef']

wfs1: &WFS
  class:             'IdealDerivativeSensor'
  simul_params_ref:  'main'
  subapdata_object:  'kapa_n20_ideal'
  fov:               4.0            # [arcsec]; sets the slope unit (specula_slope_scale)
  inputs:
    in_ef:           'prop.out_lgs1_ef'
  outputs: ['out_slopes']
wfs2: { <<: *WFS, inputs: { in_ef: 'prop.out_lgs2_ef' } }
wfs3: { <<: *WFS, inputs: { in_ef: 'prop.out_lgs3_ef' } }
wfs4: { <<: *WFS, inputs: { in_ef: 'prop.out_lgs4_ef' } }
wfs5: { <<: *WFS, inputs: { in_ef: 'prop.out_lgs5_ef' } }
wfs6: { <<: *WFS, inputs: { in_ef: 'prop.out_lgs6_ef' } }

rec:
  class:             'ModalrecExplicitPolc'
  recmat_object:     'pytomoao_rec'             # written by specula_ltao.py build
  intmat_object:     'kapa_dm349_6lgs_im'       # written by specula_ltao.py calibrate
  inputs:
    in_slopes_list:  ['wfs1.out_slopes', 'wfs2.out_slopes', 'wfs3.out_slopes',
                      'wfs4.out_slopes', 'wfs5.out_slopes', 'wfs6.out_slopes']
    in_commands:     'control.out_comm:-1'
  outputs: ['out_modes']

control:
  class:             'Integrator'
  int_gain:          [0.5]
  n_modes:           [349]
  delay:             0                          # only the 1-step feedback lag (dm.out_layer:-1)
  inputs:
    delta_comm:      'rec.out_modes'
  outputs: ['out_comm']

dm:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'kapa_dm349'
  height:            0
  inputs:
    in_command:      'control.out_comm'
  outputs: ['out_layer']

data_store:
  class:             'DataStore'
  store_dir:         './output'
  downsample_factor: 5
  inputs:
    input_list: ['sci-prop.out_sci_ef', 'comm-control.out_comm']
