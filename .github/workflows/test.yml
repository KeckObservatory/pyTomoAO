name: Run Pytest

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failing version, not just the first.
      fail-fast: false
      matrix:
        include:
          # 3.8 is the oldest version python_requires claims; the GitHub-hosted
          # ubuntu-latest image no longer provides it, so pin that leg to 22.04.
          - {python-version: '3.8', os: ubuntu-22.04}
          - {python-version: '3.9', os: ubuntu-latest}
          - {python-version: '3.10', os: ubuntu-latest}
          - {python-version: '3.11', os: ubuntu-latest}
          - {python-version: '3.12', os: ubuntu-latest}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install the package itself rather than a requirements file, so CI
      # exercises the dependency metadata that users actually resolve.
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: pytest

      # The coverage gate only needs to run once; use the newest version.
      - name: Run coverage gate
        if: matrix.python-version == '3.12'
        run: |
          python .github/github_pytest_workflow.py \
            --fail-on-problems --verbose --coverage-threshold 50
