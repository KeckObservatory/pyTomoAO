name: Code health

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Pinned so a new ruff release cannot fail an unrelated pull request.
      # Keep in sync with the [dev] extra in setup.py.
      - name: Install ruff
        run: python -m pip install ruff==0.15.5

      # Rules and per-file exceptions live in pyproject.toml.
      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check --diff .
