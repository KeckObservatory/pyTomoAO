name: Publish Python Package to PyPI

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      # Catch a malformed README or bad metadata before anything is uploaded;
      # a version can never be re-uploaded to PyPI once published.
      - name: Verify distributions
        run: twine check --strict dist/*

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --upgrade pip
          /tmp/wheel-check/bin/pip install dist/*.whl
          # Run outside the repo so the installed package is imported, not the source tree.
          cd /tmp && /tmp/wheel-check/bin/python -c "
          import pyTomoAO
          print('installed pyTomoAO', pyTomoAO.__version__)
          from pyTomoAO.tomographicReconstructor import tomographicReconstructor
          "

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Gate on a GitHub environment so publishing can require a review rule, and
    # so the OIDC claim carries the environment name.
    environment:
      name: pypi
      url: https://pypi.org/p/pyTomoAO
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # For Test PyPI, uncomment the following lines
        # with:
        #   repository-url: https://test.pypi.org/legacy/
